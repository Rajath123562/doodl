function giveHint(){if(page!=='game'||isDrawer||hasGuessed||showResult)return;if(hintsUsed>=2){toast('All hints used this round');return}hintsUsed++;const letters=['_','_','_','_','_'];if(hintsUsed>=1)letters[1]='I';if(hintsUsed>=2)letters[4]='A';$('wordDisplay').textContent=letters.join(' ');$('wordHint').textContent='Hint '+hintsUsed+'/2 · -'+(hintsUsed*60)+' points';const hint=$('hintMeter');if(hint)hint.textContent=(2-hintsUsed)+' hints left · -'+(hintsUsed*60)+' pts';toast('A letter revealed! Correct guess earns fewer points.')}
function creditDaily(){if(profile.dailyDate===todayLocal())return false;const prev=profile.dailyDate;const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const key=[yesterday.getFullYear(),String(yesterday.getMonth()+1).padStart(2,'0'),String(yesterday.getDate()).padStart(2,'0')].join('-');profile.dailyStreak=prev===key?(profile.dailyStreak||0)+1:1;profile.dailyDate=todayLocal();earnXP(100);return true}

function setupCanvas(){canvas=$('drawingCanvas');if(!canvas)return;ctx=canvas.getContext('2d');const obs=new ResizeObserver(()=>resizeCanvas());obs.observe(canvas);canvas._resizeObserver=obs;resizeCanvas();let drawing=false;const pos=(event)=>{let rect=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))}};canvas.addEventListener('pointerdown',e=>{if(!isDrawer||wordOverlay||showResult)return;if(e.pointerType==='mouse'&&e.button!==0)return;const p=pos(e);if(tool==='stamp'){strokes.push({kind:'stamp',points:[p],emoji:stampEmoji,size:Math.max(24,brush*4)});redoStack=[];redraw();return}drawing=true;draft={kind:tool,points:[p],color:tool==='eraser'?'#ffffff':color,size:tool==='eraser'?brush*2.6:brush,seed:rainbowSeed};rainbowSeed=(rainbowSeed+35)%360;try{canvas.setPointerCapture(e.pointerId)}catch(_e){}redraw()});canvas.addEventListener('pointermove',e=>{if(!drawing||!draft)return;const p=pos(e),last=draft.points[draft.points.length-1];if(tool==='line'){draft.points=[draft.points[0],p];redraw();return}if(Math.hypot((p.x-last.x)*canvas.clientWidth,(p.y-last.y)*canvas.clientHeight)<1.2)return;draft.points.push(p);redraw()});const done=()=>{if(!drawing||!draft)return;drawing=false;strokes.push(draft);redoStack=[];draft=null;redraw()};canvas.addEventListener('pointerup',done);canvas.addEventListener('pointercancel',done)}
function resizeCanvas(){if(!canvas||!ctx)return;const dpr=Math.min(devicePixelRatio||1,2),w=Math.floor(canvas.clientWidth*dpr),h=Math.floor(canvas.clientHeight*dpr);if(w===canvas.width&&h===canvas.height)return;canvas.width=w;canvas.height=h;ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function drawStroke(s){if(!ctx||!canvas||!s.points.length)return;const w=canvas.clientWidth,h=canvas.clientHeight;const pts=s.points;ctx.save();if(s.kind==='stamp'){ctx.font=Math.round(s.size)+'px system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.emoji||'⭐',pts[0].x*w,pts[0].y*h);ctx.restore();return}ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.size;ctx.lineJoin='round';ctx.lineCap='round';if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x*w,pts[0].y*h,s.size/2,0,Math.PI*2);ctx.fillStyle=s.kind==='rainbow'?'hsl('+s.seed+',85%,55%)':s.color;ctx.fill();ctx.restore();return}if(s.kind==='rainbow'){for(let i=1;i<pts.length;i++){ctx.strokeStyle='hsl('+((s.seed+i*7)%360)+',88%,57%)';ctx.beginPath();ctx.moveTo(pts[i-1].x*w,pts[i-1].y*h);ctx.lineTo(pts[i].x*w,pts[i].y*h);ctx.stroke()}}else{ctx.beginPath();ctx.moveTo(pts[0].x*w,pts[0].y*h);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x*w,pts[i].y*h);ctx.stroke()}ctx.restore()}
function redraw(){if(!canvas||!ctx)return;const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);strokes.forEach(drawStroke);if(draft)drawStroke(draft)}
function stopLoops(){clearInterval(timerId);clearInterval(botId);clearInterval(animationId);timerId=botId=animationId=null}
document.addEventListener('keydown',e=>{if(page!=='game'||!isDrawer)return;const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();act('undo')}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();act('redo')}});
window.addEventListener('beforeunload',stopLoops);
renderHome();
})();
</script>
</body>
